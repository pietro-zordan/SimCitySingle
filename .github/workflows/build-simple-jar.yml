name: Build simple JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn -DskipTests clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimCityLite-simple-jar
          path: target/SimCityLite.jar
